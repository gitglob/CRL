# Ablation: the small L2 regularization the CBP paper pairs with continual
# backpropagation in its RL experiments. Off by default in base.yaml so that
# CBP-vs-no-CBP stays a single-variable comparison.
inherits: base.yaml
benchmark:
  arms: [cbp, replay_cbp]
train:
  l2_lambda: 0.0001
output:
  root: results/cbp_l2
