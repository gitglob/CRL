# Ablation: a ten-times slower replacement rate. At 1e-4 every unit is replaced
# roughly ten times per task, which is aggressive for a net that solves CartPole
# in 20-30k steps.
inherits: base.yaml
benchmark:
  arms: [cbp, replay_cbp]
cbp:
  replacement_rate: 0.00001
output:
  root: results/cbp_slow
