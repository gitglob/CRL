experiment: stability-plasticity
seed: 0
suite: minatar
output: results
workers: auto
arms: [finetune, cbp, replay, clear, clear_cbp]
cycles: 5
device: cuda
smoke: false
train:
  hidden_sizes: [256, 256]
  learning_rate: 0.0003
  gamma: 0.99
  gradient_clip: 1.0
  unroll_length: 16
  batch_unrolls: 16
  num_envs: 16
  block_steps: 499968
  probe_steps: 5242880
  value_weight: 0.5
  entropy_weight: 0.005
probe_train:
  learning_rate: 0.001
  gamma: 0.99
  entropy_weight: 0.005
clear:
  replay_ratio: 0.5
  capacity: 100000
  policy_cloning_weight: 0.01
  value_cloning_weight: 0.005
cbp:
  utility: contribution
  replacement_rate: 0.0001
  maturity_threshold: 1000
  decay_rate: 0.99
diagnostics:
  window_steps: 1000
  period: 1000
  rank_period: 10000
eval:
  episodes: 10
  period: 25000
  clips: true
  clip_stride: 4
