experiment: showcase
seed: 0
suite: minatar
max_seconds: 3600
output: results/showcase
workers: auto
arms:
- finetune
- cbp
- replay
- clear
- clear_cbp
cycles: 20
device: cuda
smoke: false
train:
  hidden_sizes:
  - 256
  - 256
  learning_rate: 0.0003
  gamma: 0.99
  gradient_clip: 1.0
  unroll_length: 16
  batch_unrolls: 16
  num_envs: 16
  block_steps: 32768
  probe_steps: 32768
  value_weight: 0.5
  entropy_weight: 0.005
clear:
  replay_ratio: 0.5
  capacity: 100000
  policy_cloning_weight: 0.01
  value_cloning_weight: 0.005
cbp:
  utility: contribution
  replacement_rate: 0.0001
  maturity_threshold: 1000
  decay_rate: 0.99
  dead_threshold: 0.025
eval:
  episodes: 5
  points_per_block: 4
  fixed_observations: 256
  clips: true
  clip_stride: 4
